// 메시지 형식의 패키지 v1은 유지한다. 동작 계약 contract_version=2는 첫 샘플부터 예측한다.
syntax = "proto3";
package magnavi.positioning.v1;
option java_package = "com.example.magnavi_springserver.positioning.grpc.v1";
option java_multiple_files = true;

// 한 호출은 한 측정 연결이다. 첫 요청은 start, 첫 응답은 ready여야 한다.
service PositioningService {
  rpc PredictStream(stream StreamRequest) returns (stream StreamEvent);
}

// start는 한 번만 보낸다. ready 이후에는 sample만 순서대로 보낸다.
message StreamRequest {
  oneof payload {
    StartMeasurement start = 1;
    SensorSample sample = 2;
  }
}

// sensor_profile_id는 단위·축·방향 표현·샘플 주기를 합의한 규격의 ID다.
// 현재 실제 앱 규격은 미확정이다. Python은 모르는 규격을 거절해야 한다.
message StartMeasurement {
  string session_id = 1;
  uint32 contract_version = 2;
  string model_key = 3;
  string model_version = 4;
  string sensor_profile_id = 5;
}

// 0도 정상 값이다. optional로 누락과 실제 0을 구분한다.
message Vector3 {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
}

// sequence는 1부터 연속 증가한다. 경과 시간은 첫 샘플이 0이며 이후 증가한다.
// elapsed_nanos는 동일 기기의 단조 시계 기준 상대 시간이다. 서버 시각과 빼지 않는다.
message SensorSample {
  optional int64 sequence = 1;
  optional int64 elapsed_nanos = 2;
  Vector3 magnetic = 3;
  Vector3 orientation = 4;
}

// 계약 2에서는 ready 이후 첫 입력부터 prediction을 정확히 하나씩 같은 순서로 보낸다.
// 치명적 실패는 gRPC 상태 코드로 호출을 종료하며 내부 오류 원문은 보내지 않는다.
message StreamEvent {
  string session_id = 1;
  oneof payload {
    StreamReady ready = 2;
    WarmingUp warming_up = 3;
    Prediction prediction = 4;
  }
}

// 계약 버전 2와 요청한 모델·센서 규격이 일치해야 한다. required_count=16은 필터 윈도우 크기다.
message StreamReady {
  uint32 contract_version = 1;
  string model_key = 2;
  string model_version = 3;
  string sensor_profile_id = 4;
  uint32 required_count = 5;
}

// 기존 필드 번호 보존용 메시지다. 계약 2 서버는 warming_up을 보내지 않으며 클라이언트도 거절한다.
message WarmingUp {
  optional int64 sequence = 1;
  uint32 buffered_count = 2;
  uint32 required_count = 3;
}

// 코드는 문자열을 그대로 보존한다. score는 모델 점수이며 실제 정확도를 보장하지 않는다.
message Candidate {
  string location_code = 1;
  optional double score = 2;
}

// 계약 2는 첫 입력부터 pad 정책으로 예측한다. 후보는 점수 내림차순 1~3개이며 첫 후보가 최상위다.
message Prediction {
  optional int64 sequence = 1;
  string model_key = 2;
  string model_version = 3;
  string location_code = 4;
  optional double score = 5;
  repeated Candidate candidates = 6;
}
